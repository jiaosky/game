<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>一杯到底 · 倒水解谜</title>
<style>
:root{
  --bg1:#f6ecd8; --bg2:#e7d3b0;
  --ink:#5b4432; --muted:#9a8066;
  --gold:#c89b3c; --gold2:#e0bd6f;
  --card:#fff9ee; --line:#d8c39a;
  --danger:#b3543f; --green:#1f9d6b;
  --wood1:#7a4c28; --wood2:#5f3a1e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 620px at 50% -10%, #fff7e6 0%, rgba(255,247,230,0) 62%),
    radial-gradient(900px 520px at 108% 108%, rgba(214,170,105,.30) 0%, rgba(214,170,105,0) 60%),
    linear-gradient(160deg,#f9f0de 0%, #eed9b6 55%, #e4cba1 100%);
  min-height:100vh;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
#app{max-width:560px;margin:0 auto;padding:16px 14px 30px;min-height:100vh;display:flex;flex-direction:column;}
.screen{display:none;}
.screen.active{display:flex;flex-direction:column;gap:14px;}

/* start screen */
.hero{text-align:center;margin-top:14px;}
h1{font-size:40px;letter-spacing:4px;color:#7a5a2e;margin:0;
  text-shadow:0 2px 0 #fff,0 4px 14px rgba(160,120,60,.20);}
.subtitle{color:var(--muted);margin:8px 0 0;font-size:14px;letter-spacing:2px;}
.diffs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.diff{
  background:linear-gradient(180deg,#fffaf0,#f5e8cd);
  border:2px solid var(--line);border-radius:16px;padding:13px 12px;text-align:left;
  color:var(--ink);cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 8px rgba(150,110,60,.10);
  transition:transform .08s ease,border-color .12s ease,box-shadow .12s ease;
}
.diff:active{transform:scale(.97);}
.diff.selected{border-color:var(--gold);box-shadow:inset 0 1px 0 #fff,0 0 0 3px rgba(200,155,60,.18),0 4px 10px rgba(150,110,60,.12);}
.diff .dn{display:block;font-size:17px;font-weight:800;}
.diff .dd{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4;}

.btn{border:0;border-radius:15px;padding:14px 18px;font-size:17px;font-weight:800;cursor:pointer;
  letter-spacing:1px;transition:transform .08s ease,filter .12s ease;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.3);}
.primary{background:linear-gradient(180deg,#f0d28a,#c89b3c);color:#4a3414;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 4px 0 #a97f2d,0 8px 16px rgba(160,120,50,.30);}
.ghost{background:linear-gradient(180deg,#fffaf0,#f1e3c6);color:var(--ink);border:2px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 5px rgba(0,0,0,.05);}
.small{padding:8px 11px;font-size:14px;border-radius:11px;}
.hint-line{color:var(--muted);font-size:12px;text-align:center;margin:0;line-height:1.5;}

/* game screen */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.level{font-weight:800;font-size:14px;background:linear-gradient(180deg,#fffaf0,#f2e4c8);
  border:2px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:inset 0 1px 0 #fff;}
.steps-row{text-align:center;color:var(--muted);font-size:13px;letter-spacing:1px;}
.steps-row b{font-size:21px;color:var(--ink);margin:0 3px;}
.board-wrap{width:100%;display:flex;justify-content:center;}
canvas{
  display:block;border-radius:22px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, rgba(0,0,0,0) 2px 7px),
    linear-gradient(180deg, var(--wood1) 0%, var(--wood2) 100%);
  box-shadow:inset 0 0 0 1px rgba(60,35,15,.65),inset 0 2px 10px rgba(0,0,0,.28),0 14px 34px rgba(90,55,20,.30);
}
.status{min-height:22px;text-align:center;color:var(--danger);font-size:13.5px;font-weight:700;}
.props{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px;}
.prop{
  background:linear-gradient(180deg,#fffaf0,#f5e8cd);border:2px solid var(--line);border-radius:15px;
  padding:10px 4px 9px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 8px rgba(150,110,60,.10);
}
.prop:active{transform:scale(.96);}
.prop:disabled{opacity:.36;cursor:not-allowed;filter:grayscale(.35);}
.prop .ico{font-size:24px;line-height:1;}
.prop .pname{font-size:12px;font-weight:800;}
.prop .pcnt{font-size:10.5px;color:var(--gold);font-weight:900;}
.prop.danger{background:linear-gradient(180deg,#fdf6f2,#f3ddd3);border-color:#e0b7a5;color:var(--danger);}

/* modal */
.modal{position:fixed;inset:0;background:rgba(70,50,30,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:24px;z-index:20;}
.modal.show{display:flex;}
.modal-card{
  background:linear-gradient(180deg,#fffaf0,#f6ead2);border:2px solid var(--gold2);border-radius:22px;
  padding:28px 24px;text-align:center;width:100%;max-width:360px;
  box-shadow:inset 0 1px 0 #fff,0 20px 60px rgba(90,60,20,.38);
}
.modal-card h2{margin:0 0 10px;color:#7a5a2e;}
.stars{font-size:36px;letter-spacing:7px;color:#e6b33c;text-shadow:0 2px 0 #fff;}
.muted{color:var(--muted);font-size:13.5px;margin:10px 0 18px;}
.modal-actions{display:flex;gap:10px;justify-content:center;}
.modal-actions .btn{flex:1;}

@media (max-width: 390px){
  #app{padding:10px 8px 22px;}
  h1{font-size:32px;letter-spacing:3px;}
  .diffs{gap:8px;}
  .diff{padding:10px 9px;}
  .diff .dn{font-size:15.5px;}
  .props{gap:6px;}
  .prop .ico{font-size:21px;}
  .btn{padding:13px 16px;font-size:16px;}
}
</style>
</head>
<body>
<div id="app">
  <section id="startScreen" class="screen active">
    <div class="hero">
      <h1>一杯到底</h1>
      <p class="subtitle">同色归位 · 倒水解谜</p>
    </div>
    <div class="diffs" id="difficultyList"></div>
    <button class="btn primary" id="startBtn" disabled>开始游戏</button>
    <p class="hint-line">难度由颜色数、隐藏杯子、试管数量综合评定</p>
    <button class="btn ghost small" id="selfCheckBtn">自检：验证每关必有解</button>
    <p class="hint-line" id="selfCheckResult"></p>
  </section>

  <section id="gameScreen" class="screen">
    <div class="topbar">
      <button class="btn ghost small" id="backBtn">‹ 返回</button>
      <div class="level"><span id="diffName"></span> · 第 <span id="levelNum">1</span> 关</div>
      <button class="btn ghost small" id="muteBtn">🔊</button>
    </div>
    <div class="steps-row">已走 <b id="stepNum">0</b> 步</div>
    <div class="board-wrap"><canvas id="board"></canvas></div>
    <div class="status" id="statusMsg"></div>
    <div class="props" id="propsBar">
      <button class="prop" data-prop="tube"><span class="ico">🧪</span><span class="pname">空试管</span><span class="pcnt" id="cnt-tube">×1</span></button>
      <button class="prop" data-prop="hint"><span class="ico">💡</span><span class="pname">提示</span><span class="pcnt" id="cnt-hint">×1</span></button>
      <button class="prop" data-prop="undo"><span class="ico">↩️</span><span class="pname">撤回</span><span class="pcnt" id="cnt-undo">×1</span></button>
      <button class="prop danger" data-prop="reset"><span class="ico">🔄</span><span class="pname">重开</span></button>
    </div>
  </section>
</div>

<div class="modal" id="winModal">
  <div class="modal-card">
    <h2>通关！</h2>
    <div class="stars" id="winStars">★★★</div>
    <p class="muted">本关用了 <b id="winSteps">0</b> 步</p>
    <div class="modal-actions">
      <button class="btn primary" id="nextBtn">下一关</button>
      <button class="btn ghost" id="homeBtn">选难度</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= 常量与纯逻辑 ================= */
const CAP = 4;
const MAX_TUBES = 18;
/* 14 色，颜色采样时尽量拉开色相 */
const PALETTE = ['#e53935','#fb8c00','#fdd835','#43a047','#00897b','#1e88e5','#8e24aa','#ec407a','#8d6e63','#455a64'];
const HIDDEN_COLOR = '#8a8f98';

function randInt(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 顶部同色连续段（整段倒水规则） */
function topRunInt(t){
  if(!t.length) return {color:-1, len:0};
  const c = t[t.length-1];
  let len = 0;
  for(let i = t.length-1; i >= 0 && t[i] === c; i--) len++;
  return {color:c, len};
}
function canPourInt(tubes, a, b){
  if(a === b || !tubes[a].length) return null;
  const r = topRunInt(tubes[a]);
  const free = CAP - tubes[b].length;
  if(free <= 0) return null;
  if(tubes[b].length && tubes[b][tubes[b].length-1] !== r.color) return null;
  return {color:r.color, len:r.len, amount:Math.min(r.len, free)};
}
function applyInt(tubes, a, b){
  const nt = tubes.map(t => t.slice());
  const r = canPourInt(nt, a, b);
  if(!r) return nt;
  for(let i = 0; i < r.amount; i++){ nt[a].pop(); nt[b].push(r.color); }
  return nt;
}
function canonInt(tubes){ return tubes.map(t => t.join('')).sort().join('|'); }
function isSolvedInt(tubes){
  return tubes.every(t => !t.length || (t.length === CAP && t.every(x => x === t[0])));
}
function hasReadyTube(tubes){
  return tubes.some(t => t.length === CAP && t.every(x => x === t[0]));
}
function scoreMoveInt(tubes, a, b, r){
  let s = 0;
  const d = tubes[b];
  if(d.length && d[d.length-1] === r.color && d.length + r.amount === CAP) s += 8;
  if(!d.length) s -= 2; else if(d[d.length-1] === r.color) s += 4;
  if(!d.length && r.amount === tubes[a].length) s -= 4;
  s += r.amount;
  return s;
}

/* 求解器：启发式 DFS。locked=当前不可用的管索引集合（隐藏杯） */
function solve(tubes, budget, maxDepth, locked){
  const visited = new Set();
  let nodes = 0;
  function dfs(state, depth, prevA, prevB){
    nodes++;
    if(isSolvedInt(state)) return [];
    if(depth >= maxDepth) return null;
    if(nodes > budget) return 'BUDGET';
    const key = canonInt(state);
    if(visited.has(key)) return null;
    visited.add(key);
    const moves = [];
    for(let a = 0; a < state.length; a++){
      if(!state[a].length) continue;
      if(locked && locked.has(a)) continue;
      for(let b = 0; b < state.length; b++){
        if(a === b || (a === prevB && b === prevA)) continue;
        if(locked && locked.has(b)) continue;
        const r = canPourInt(state, a, b);
        if(r) moves.push({a, b, r, s: scoreMoveInt(state, a, b, r)});
      }
    }
    moves.sort((x, y) => y.s - x.s);
    for(const m of moves){
      const ns = applyInt(state, m.a, m.b);
      const res = dfs(ns, depth + 1, m.a, m.b);
      if(res === 'BUDGET') return 'BUDGET';
      if(res) return [{a:m.a, b:m.b}, ...res];
    }
    return null;
  }
  const res = dfs(tubes, 0, -1, -1);
  return {res, nodes};
}

/* 随机布局：4C 个色块洗牌后装入 C 根满管，留 empties 根空管 */
function randomState(colors, empties){
  const units = [];
  for(let c = 0; c < colors; c++) for(let k = 0; k < CAP; k++) units.push(c);
  const s = shuffle(units);
  const tubes = [];
  for(let i = 0; i < colors; i++) tubes.push(s.slice(i * CAP, i * CAP + CAP));
  for(let e = 0; e < empties; e++) tubes.push([]);
  return tubes;
}

/* 确定性兜底：两色交错，无“已成管” */
function shiftState(colors, empties){
  const tubes = [];
  for(let i = 0; i < colors; i++) tubes.push([i, (i + 1) % colors, i, (i + 1) % colors]);
  for(let e = 0; e < empties; e++) tubes.push([]);
  return tubes;
}

/* 生成：只接受“求解器验证有解、且开局无已成水管”的布局 */
function generate(colors, empties){
  const budget = 2000000, maxDepth = 300, maxAttempts = 200;
  for(let a = 0; a < maxAttempts; a++){
    const st = randomState(colors, empties);
    if(isSolvedInt(st) || hasReadyTube(st)) continue;
    const r = solve(st, budget, maxDepth);
    if(r.res && r.res !== 'BUDGET') return {state: st, solution: r.res};
  }
  for(let a = 0; a < 30; a++){
    const st = randomState(colors, empties);
    if(isSolvedInt(st) || hasReadyTube(st)) continue;
    const r = solve(st, 8000000, 500);
    if(r.res && r.res !== 'BUDGET') return {state: st, solution: r.res};
  }
  const st = shiftState(colors, empties);
  const r = solve(st, 8000000, 500);
  if(r.res && r.res !== 'BUDGET') return {state: st, solution: r.res};
  console.error('无法生成有解关卡');
  return null;
}

/* 颜色采样：把 C 个逻辑色均匀映射到调色板，尽量拉开色相 */
function buildColorMap(colors){
  const map = [];
  for(let k = 0; k < colors; k++){
    const idx = colors === 1 ? 0 : Math.round(k * (PALETTE.length - 1) / (colors - 1));
    map.push(idx);
  }
  return map;
}

/* 隐藏杯分配：沿完整解回放，记录每根管“首次被使用前已消除的杯数”，据此锁定后置杯 */
function assignLocks(gen, maxLocked){
  const N = gen.state.length;
  let state = gen.state.map(t => t.slice());
  const firstUse = new Array(N).fill(-1);
  const unlockAt = new Array(N).fill(0);
  const cleared = new Set();
  let clearCount = 0;
  for(const m of gen.solution){
    if(firstUse[m.a] === -1){ firstUse[m.a] = 1; unlockAt[m.a] = clearCount; }
    if(firstUse[m.b] === -1){ firstUse[m.b] = 1; unlockAt[m.b] = clearCount; }
    const ns = applyInt(state, m.a, m.b);
    state = ns;
    for(let ti = 0; ti < N; ti++){
      if(!cleared.has(ti) && state[ti].length === CAP && state[ti].every(x => x === state[ti][0])){
        cleared.add(ti); clearCount++;
      }
    }
  }
  const cands = [];
  for(let ti = 0; ti < N; ti++){
    if(gen.state[ti].length && unlockAt[ti] >= 1) cands.push({ti, total: unlockAt[ti]});
  }
  cands.sort((x, y) => y.total - x.total || y.ti - x.ti);
  return cands.slice(0, Math.max(0, maxLocked)).map(p => ({ti:p.ti, total:p.total, remaining:p.total}));
}

/* 难度配置：难度 = 颜色数 + 隐藏杯子 + 试管数量 综合 */
const DIFFS = [
  {key:'nuofu',    name:'懦夫',   cMin:4,  cMax:5,  hMin:0, hMax:0, lockMin:0, lockMax:0, empties:2, desc:'入门 · 颜色少'},
  {key:'caigou',   name:'菜狗',   cMin:6,  cMax:7,  hMin:1, hMax:3, lockMin:1, lockMax:1, empties:2, desc:'轻松 · 隐藏色 + 1 隐藏杯'},
  {key:'benben',   name:'笨笨',   cMin:8,  cMax:9,  hMin:3, hMax:6, lockMin:2, lockMax:2, empties:2, desc:'困难 · 隐藏色多 + 2 隐藏杯'},
  {key:'tianlong', name:'天龙人', cMin:10, cMax:10, hMin:6, hMax:10, lockMin:3, lockMax:4, empties:2, desc:'极难 · 满配颜色/隐藏色/隐藏杯'},
];

/* 可玩态：色块 = {color, hidden} */
function makePlayable(intTubes){
  return intTubes.map(t => t.map(c => ({color:c, hidden:false})));
}

/* 隐藏色：从杯底向上连续隐藏；lockedSet 内的隐藏杯不参与 */
function applyHiddenColors(tubes, lockedSet, total){
  let placed = 0;
  const cands = [];
  for(let ti = 0; ti < tubes.length; ti++){
    if(lockedSet.has(ti)) continue;
    if(tubes[ti].length >= 2) cands.push(ti);
  }
  if(!cands.length) return;
  const order = shuffle(cands);
  for(let guard = 0; guard < total * 5 + 10 && placed < total; guard++){
    const ti = order[Math.floor(Math.random() * order.length)];
    const t = tubes[ti];
    let hiddenCount = 0;
    for(const c of t) if(c.hidden) hiddenCount++;
    if(hiddenCount >= t.length - 1) continue;
    t[hiddenCount].hidden = true;
    placed++;
  }
}

/* ================= 可玩态倒水逻辑 ================= */
function topRunCells(t){
  if(!t.length) return {color:-1, len:0};
  const c = t[t.length-1].color;
  let len = 0;
  for(let i = t.length-1; i >= 0 && t[i].color === c; i--) len++;
  return {color:c, len};
}
function canPourCells(tubes, a, b){
  if(a === b || !tubes[a].length) return null;
  const r = topRunCells(tubes[a]);
  const free = CAP - tubes[b].length;
  if(free <= 0) return null;
  if(tubes[b].length && tubes[b][tubes[b].length-1].color !== r.color) return null;
  return {color:r.color, len:r.len, amount:Math.min(r.len, free)};
}
function applyCellMove(tubes, a, b){
  const r = canPourCells(tubes, a, b);
  for(let i = 0; i < r.amount; i++){
    const cell = tubes[a].pop();
    cell.hidden = false;
    tubes[b].push(cell);
  }
  if(tubes[a].length) tubes[a][tubes[a].length - 1].hidden = false;
  return r;
}
function hasAnyMove(tubes, locked){
  for(let a = 0; a < tubes.length; a++){
    if(!tubes[a].length) continue;
    if(locked && locked.has(a)) continue;
    for(let b = 0; b < tubes.length; b++){
      if(a === b) continue;
      if(locked && locked.has(b)) continue;
      if(canPourCells(tubes, a, b)) return true;
    }
  }
  return false;
}
function deepCloneTubes(tubes){ return tubes.map(t => t.map(c => ({color:c.color, hidden:c.hidden}))); }
/* ================= 游戏状态 ================= */
let game = null;
let selected = null;
let hintMove = null;
let anim = null;
let muted = false;
let audioCtx = null;
let statusTimer = null;
let tubeRects = [];

const $ = id => document.getElementById(id);
const boardCanvas = $('board');
const ctx = boardCanvas.getContext('2d');

function cloneLocks(m){ const n = new Map(); m.forEach((v,k) => n.set(k, {total:v.total, remaining:v.remaining})); return n; }
function lockedSet(){ return game ? new Set(game.locks.keys()) : new Set(); }

function setStatus(msg){
  $('statusMsg').textContent = msg;
  clearTimeout(statusTimer);
  if(msg) statusTimer = setTimeout(() => { $('statusMsg').textContent = ''; }, 2800);
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* 难度按钮 */
function renderDiffButtons(){
  const wrap = $('difficultyList');
  wrap.innerHTML = '';
  let saved = 'nuofu';
  try { saved = localStorage.getItem('ybd_diff') || 'nuofu'; } catch(e){}
  DIFFS.forEach(d => {
    const b = document.createElement('button');
    b.className = 'diff' + (d.key === saved ? ' selected' : '');
    const name = document.createElement('span'); name.className = 'dn'; name.textContent = d.name;
    const desc = document.createElement('span'); desc.className = 'dd'; desc.textContent = d.desc;
    b.appendChild(name); b.appendChild(desc);
    b.addEventListener('click', () => {
      document.querySelectorAll('.diff').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      try { localStorage.setItem('ybd_diff', d.key); } catch(e){}
      $('startBtn').disabled = false;
    });
    wrap.appendChild(b);
  });
  $('startBtn').disabled = false;
}

function startGame(){
  let key = 'nuofu';
  try { key = localStorage.getItem('ybd_diff') || 'nuofu'; } catch(e){}
  const diff = DIFFS.find(d => d.key === key) || DIFFS[0];
  game = {diff, level: 1};
  showScreen('gameScreen');
  newLevel();
}
function nextLevel(){ game.level++; newLevel(); }

function newLevel(){
  const diff = game.diff;
  const C = randInt(diff.cMin, diff.cMax);
  const lockMax = randInt(diff.lockMin, diff.lockMax);
  let gen = null, locks = [];
  for(let attempt = 0; attempt < 60; attempt++){
    gen = generate(C, diff.empties);
    if(!gen) break;
    locks = assignLocks(gen, lockMax);
    if(locks.length >= diff.lockMin) break;
  }
  if(!gen){ setStatus('生成失败，请重试'); return; }
  const initial = makePlayable(gen.state);
  const H = randInt(diff.hMin, diff.hMax);
  const lockedIdx = new Set(locks.map(l => l.ti));
  applyHiddenColors(initial, lockedIdx, H);
  game.C = C;
  game.H = H;
  game.colorMap = buildColorMap(C);
  game.initial = deepCloneTubes(initial);
  game.tubes = deepCloneTubes(initial);
  game.solution = gen.solution;
  game.par = gen.solution.length || 10;
  game.steps = 0;
  game.history = [];
  game.props = {tube:1, hint:1, undo:1};
  game.cleared = new Set();
  game.fx = {};
  game.revealFx = {};
  game.locks = new Map(locks.map(l => [l.ti, {total:l.total, remaining:l.total}]));
  game.initialLocks = cloneLocks(game.locks);
  selected = null; hintMove = null; anim = null;
  updateHUD();
  layout();
  setStatus('第 ' + game.level + ' 关 · ' + C + ' 色 · 隐藏杯 ' + game.locks.size + ' · 隐藏色 ' + H + ' · 共 ' + game.tubes.length + ' 管');
}

function updateHUD(){
  if(!game) return;
  $('diffName').textContent = game.diff.name;
  $('levelNum').textContent = game.level;
  $('stepNum').textContent = game.steps;
  $('cnt-tube').textContent = '×' + game.props.tube;
  $('cnt-hint').textContent = '×' + game.props.hint;
  $('cnt-undo').textContent = '×' + game.props.undo;
  document.querySelectorAll('#propsBar .prop').forEach(b => {
    const k = b.dataset.prop;
    if(k === 'reset') return;
    let dis = game.props[k] <= 0;
    if(k === 'tube') dis = dis || game.tubes.length >= MAX_TUBES;
    if(k === 'undo') dis = dis || !game.history.length;
    b.disabled = dis;
  });
}

function isWin(){
  return game.tubes.every((t, i) => !t.length || game.cleared.has(i));
}
function markCleared(){
  const newly = [];
  for(let i = 0; i < game.tubes.length; i++){
    const t = game.tubes[i];
    if(!game.cleared.has(i) && t.length === CAP && t.every(c => c.color === t[0].color)){
      game.cleared.add(i);
      game.fx[i] = performance.now();
      newly.push(i);
    }
  }
  for(const _ of newly){
    game.locks.forEach((l, ti) => { l.remaining--; });
  }
  const reveal = [];
  game.locks.forEach((l, ti) => { if(l.remaining <= 0) reveal.push(ti); });
  reveal.forEach(ti => { game.locks.delete(ti); game.revealFx[ti] = performance.now(); });
  return newly.length > 0;
}

/* ================= 绘制 ================= */
function roundRect(x, y, w, h, r){
  if(w <= 0 || h <= 0) return;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function hexToRgb(hex){ const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(hex, amt){
  const c = hexToRgb(hex);
  const f = v => Math.max(0, Math.min(255, Math.round(v + amt * 255)));
  return 'rgb(' + f(c[0]) + ',' + f(c[1]) + ',' + f(c[2]) + ')';
}
function colorOf(c){ return PALETTE[game.colorMap[c % game.colorMap.length]]; }

function layout(){
  const wrap = boardCanvas.parentElement;
  const cssW = wrap.clientWidth || 360;
  const T = game.tubes.length;
  const cols = Math.min(7, Math.max(3, Math.ceil(T / 2)));
  const rows = Math.ceil(T / cols);
  const padX = 10, padY = 14, gapX = 10, gapY = 12;
  const availW = cssW - padX * 2;
  const tubeW = Math.min(132, Math.max(28, Math.floor((availW - (cols - 1) * gapX) / cols)));
  const segH = Math.round(tubeW * 0.34);
  const neck = 10;
  const tubeH = neck + 10 + CAP * segH;
  const cssH = padY * 2 + rows * (tubeH + gapY) - gapY;
  const dpr = window.devicePixelRatio || 1;
  boardCanvas.style.width = cssW + 'px';
  boardCanvas.style.height = cssH + 'px';
  boardCanvas.width = Math.round(cssW * dpr);
  boardCanvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tubeRects = [];
  const totalW = cols * tubeW + (cols - 1) * gapX;
  const startX = (cssW - totalW) / 2;
  for(let i = 0; i < T; i++){
    const r = Math.floor(i / cols), c = i % cols;
    tubeRects.push({x: startX + c * (tubeW + gapX), y: padY + r * (tubeH + gapY), w: tubeW, h: tubeH, segH});
  }
  draw();
}

function drawSegment(sx, sy, sw, sh, color, hidden){
  if(hidden){
    roundRect(sx, sy, sw, sh, Math.min(5, sh / 2));
    ctx.fillStyle = HIDDEN_COLOR;
    ctx.fill();
    ctx.fillStyle = '#5f6672';
    ctx.font = 'bold ' + Math.max(9, Math.round(sh * 0.6)) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', sx + sw / 2, sy + sh / 2 + 1);
    return;
  }
  const g = ctx.createLinearGradient(sx, sy, sx, sy + sh);
  g.addColorStop(0, shade(color, 0.30));
  g.addColorStop(0.45, color);
  g.addColorStop(1, shade(color, -0.24));
  roundRect(sx, sy, sw, sh, Math.min(5, sh / 2));
  ctx.fillStyle = g;
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.08)';
  roundRect(sx, sy + sh - Math.max(1.5, sh * 0.16), sw, Math.max(1.5, sh * 0.16), 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.34)';
  roundRect(sx + 2, sy + 1.5, sw - 4, Math.max(2, sh * 0.24), 3);
  ctx.fill();
}

function drawTubeBody(r, tube, ti){
  const neck = 10;
  const bodyY = r.y + neck;
  const bodyH = r.h - neck;
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  roundRect(r.x + 1.5, bodyY + 2, r.w, bodyH, 11);
  ctx.fill();
  const glass = ctx.createLinearGradient(r.x, bodyY, r.x + r.w, bodyY);
  glass.addColorStop(0, 'rgba(255,255,255,.72)');
  glass.addColorStop(0.5, 'rgba(255,255,255,.22)');
  glass.addColorStop(1, 'rgba(255,255,255,.60)');
  roundRect(r.x, bodyY, r.w, bodyH, 11);
  ctx.fillStyle = glass;
  ctx.fill();
  const segW = r.w - 8;
  const sx = r.x + 4;
  for(let i = 0; i < tube.length; i++){
    const sy = bodyY + bodyH - 4 - (i + 1) * r.segH;
    drawSegment(sx, sy, segW, r.segH - 1, colorOf(tube[i].color), tube[i].hidden && i < tube.length - 1);
  }
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(255,244,220,.85)';
  roundRect(r.x, bodyY, r.w, bodyH, 11);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(r.x + r.w / 2, bodyY, r.w / 2, 4.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,240,214,.55)';
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  roundRect(r.x + r.w * 0.27, r.y, r.w * 0.46, neck, 4);
  ctx.fill();
  const isSel = selected === ti;
  const hintA = hintMove && hintMove.a === ti;
  const hintB = hintMove && hintMove.b === ti;
  if(isSel || hintA || hintB){
    const col = isSel ? 'rgba(255,214,90,.95)' : (hintA ? 'rgba(255,190,70,.95)' : 'rgba(90,220,150,.95)');
    ctx.lineWidth = 3;
    ctx.strokeStyle = col;
    roundRect(r.x - 2.5, bodyY - 2.5, r.w + 5, bodyH + 5, 14);
    ctx.stroke();
    ctx.lineWidth = 1;
  }
}

function drawLockedTube(r, ti){
  const lock = game.locks.get(ti);
  const neck = 10;
  const bodyY = r.y + neck;
  const bodyH = r.h - neck;
  roundRect(r.x, bodyY, r.w, bodyH, 11);
  ctx.fillStyle = 'rgba(45,26,12,.55)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(20,12,6,.7)';
  ctx.stroke();
  const badgeR = Math.max(11, Math.min(r.w * 0.34, 17));
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.beginPath();
  ctx.arc(cx, cy, badgeR, 0, Math.PI * 2);
  ctx.fillStyle = '#e6b33c';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#5b3408';
  ctx.font = 'bold ' + Math.round(badgeR * 1.05) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(lock.remaining), cx, cy + 1);
}

function drawTube(r, tube, ti){
  if(game.cleared && game.cleared.has(ti)){
    const start = game.fx[ti] || performance.now();
    const p = Math.min(1, (performance.now() - start) / 320);
    if(p >= 1) return;
    ctx.save();
    ctx.globalAlpha = 1 - p;
    const sc = 1 - 0.22 * p;
    ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
    ctx.scale(sc, sc);
    ctx.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));
    drawTubeBody(r, tube, ti);
    ctx.restore();
    return;
  }
  if(game.locks && game.locks.has(ti)){
    drawLockedTube(r, ti);
    return;
  }
  if(game.revealFx && game.revealFx[ti]){
    const p = Math.min(1, (performance.now() - game.revealFx[ti]) / 280);
    if(p < 1){
      ctx.save();
      ctx.globalAlpha = p;
      const sc = 0.4 + 0.6 * p;
      ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
      ctx.scale(sc, sc);
      ctx.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));
      drawTubeBody(r, tube, ti);
      ctx.restore();
      return;
    }
  }
  drawTubeBody(r, tube, ti);
}

function drawAnimBlob(now){
  if(!anim || !tubeRects.length) return;
  const p = Math.min(1, (now - anim.start) / anim.dur);
  const e = 1 - Math.pow(1 - p, 3);
  const x = anim.from.x + (anim.to.x - anim.from.x) * e;
  const y = anim.from.y + (anim.to.y - anim.from.y) * e - Math.sin(p * Math.PI) * 24;
  const r0 = tubeRects[0];
  const w = (r0 ? r0.w : 46) * 0.6;
  const h = anim.len * (r0 ? r0.segH : 12);
  ctx.save();
  ctx.globalAlpha = 1 - p * 0.25;
  roundRect(x - w / 2, y - h / 2, w, h, 7);
  const col = colorOf(anim.color);
  const g = ctx.createLinearGradient(x - w / 2, y - h / 2, x - w / 2, y + h / 2);
  g.addColorStop(0, shade(col, 0.3));
  g.addColorStop(1, shade(col, -0.2));
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function draw(now){
  if(!game) return;
  const dpr = window.devicePixelRatio || 1;
  const w = boardCanvas.width / dpr;
  const h = boardCanvas.height / dpr;
  ctx.clearRect(0, 0, w, h);
  for(let i = 0; i < game.tubes.length; i++){
    drawTube(tubeRects[i], game.tubes[i], i);
  }
  if(anim) drawAnimBlob(now || performance.now());
}

/* ================= 交互 ================= */
boardCanvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  if(!game) return;
  const rect = boardCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  let ti = -1;
  for(let i = 0; i < tubeRects.length; i++){
    const r = tubeRects[i];
    if(x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h){ ti = i; break; }
  }
  if(ti >= 0) onTubeTap(ti);
});

function onTubeTap(ti){
  if(anim) return;
  hintMove = null;
  if(selected === null){
    if(game.cleared.has(ti)){ setStatus('已完成的水管已消除'); return; }
    if(game.locks.has(ti)){ setStatus('还需消除 ' + game.locks.get(ti).remaining + ' 个杯子解锁'); return; }
    if(!game.tubes[ti].length){ setStatus('这是空试管，先选有水的'); return; }
    selected = ti;
    playTap();
  } else if(selected === ti){
    selected = null;
  } else {
    const a = selected, b = ti;
    selected = null;
    if(game.cleared.has(b)){ setStatus('已完成的水管已消除'); draw(); return; }
    if(game.locks.has(b)){ setStatus('还需消除 ' + game.locks.get(b).remaining + ' 个杯子解锁'); draw(); return; }
    const r = canPourCells(game.tubes, a, b);
    if(!r){
      setStatus('不能倒到这里：需同色或空管，且空间足够');
      playError();
      draw();
      return;
    }
    doPour(a, b, r);
  }
  draw();
}

function doPour(a, b, r){
  game.history.push({tubes: deepCloneTubes(game.tubes), cleared: new Set(game.cleared), locks: cloneLocks(game.locks)});
  applyCellMove(game.tubes, a, b);
  game.steps++;
  const ra = tubeRects[a], rb = tubeRects[b];
  anim = {
    from: {x: ra.x + ra.w / 2, y: ra.y + 10},
    to:   {x: rb.x + rb.w / 2, y: rb.y + 10},
    color: r.color, len: r.amount,
    start: performance.now(), dur: 250
  };
  playPour();
  updateHUD();
  draw();
  afterMove();
}

function afterMove(){
  if(!game) return;
  const added = markCleared();
  if(isWin()){
    playClear();
    setTimeout(() => showWin(), added ? 380 : 0);
    return;
  }
  if(!hasAnyMove(game.tubes, lockedSet())){
    setStatus('没有可倒的步了，用「撤回」或「重开」');
  }
}

function findHint(){
  const ints = game.tubes.map(t => t.map(c => c.color));
  const r = solve(ints, 600000, 80, lockedSet());
  if(r.res && r.res.length) return r.res[0];
  for(let a = 0; a < game.tubes.length; a++){
    if(!game.tubes[a].length || game.cleared.has(a) || game.locks.has(a)) continue;
    for(let b = 0; b < game.tubes.length; b++){
      if(a === b || game.cleared.has(b) || game.locks.has(b)) continue;
      if(canPourCells(game.tubes, a, b)) return {a, b};
    }
  }
  return null;
}

function useProp(kind){
  if(anim || !game) return;
  if(kind === 'tube'){
    if(game.props.tube <= 0) return;
    if(game.tubes.length >= MAX_TUBES){ setStatus('试管已达上限'); return; }
    game.tubes.push([]);
    game.props.tube--;
    playPour();
    updateHUD();
    layout();
  } else if(kind === 'hint'){
    if(game.props.hint <= 0) return;
    if(isWin()) return;
    game.props.hint--;
    const mv = findHint();
    if(mv){ hintMove = {a: mv.a, b: mv.b}; setStatus('按高亮操作：金色是倒出，绿色是倒入'); }
    else setStatus('先把同色合成一步即可');
    updateHUD();
    draw();
  } else if(kind === 'undo'){
    if(game.props.undo <= 0 || !game.history.length) return;
    const snap = game.history.pop();
    game.tubes = snap.tubes;
    game.cleared = snap.cleared || new Set();
    game.locks = snap.locks || new Map();
    game.steps--;
    selected = null; hintMove = null;
    updateHUD();
    draw();
    playTap();
  } else if(kind === 'reset'){
    resetLevel();
  }
}

function resetLevel(){
  game.tubes = deepCloneTubes(game.initial);
  game.steps = 0;
  game.history = [];
  game.props = {tube:1, hint:1, undo:1};
  game.cleared = new Set();
  game.fx = {};
  game.revealFx = {};
  game.locks = cloneLocks(game.initialLocks);
  selected = null; hintMove = null; anim = null;
  updateHUD();
  draw();
}

function showWin(){
  const par = game.par || 10;
  const stars = game.steps <= par ? 3 : (game.steps <= Math.ceil(par * 1.6) ? 2 : 1);
  $('winStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  $('winSteps').textContent = game.steps;
  $('winModal').classList.add('show');
  playWin();
}

/* ================= 音效 ================= */
function ensureAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function tone(freq, dur, type, vol, when){
  if(muted || !audioCtx) return;
  try{
    const t0 = audioCtx.currentTime + (when || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }catch(e){}
}
function playTap(){ tone(540, .08, 'triangle', .06); }
function playPour(){ tone(360, .12, 'sine', .07); tone(540, .1, 'sine', .05, .06); }
function playError(){ tone(170, .16, 'sawtooth', .045); }
function playClear(){ tone(660, .12, 'triangle', .07); tone(880, .14, 'triangle', .06, .08); }
function playWin(){ [523,659,784,1047].forEach((f,i) => tone(f, .18, 'triangle', .07, i * .1)); }

/* ================= 自检 ================= */
function runSelfCheck(){
  const n = 50;
  const lines = [];
  for(const d of DIFFS){
    let ok = 0;
    const t0 = performance.now();
    for(let i = 0; i < n; i++){
      const C = randInt(d.cMin, d.cMax);
      const g = generate(C, d.empties);
      if(g && g.solution && g.solution.length) ok++;
    }
    const ms = Math.round(performance.now() - t0);
    lines.push(d.name + '：' + ok + '/' + n + ' 有解（' + ms + 'ms）');
  }
  const summary = '自检：' + lines.join('；');
  console.log(summary);
  setStatus(summary);
  const resEl = $('selfCheckResult');
  if(resEl) resEl.textContent = summary;
}
window.__selfCheck = runSelfCheck;

/* ================= 事件绑定与启动 ================= */
$('startBtn').addEventListener('click', startGame);
$('backBtn').addEventListener('click', () => { showScreen('startScreen'); });
$('nextBtn').addEventListener('click', () => { $('winModal').classList.remove('show'); nextLevel(); });
$('homeBtn').addEventListener('click', () => { $('winModal').classList.remove('show'); showScreen('startScreen'); });
$('muteBtn').addEventListener('click', () => { muted = !muted; $('muteBtn').textContent = muted ? '🔇' : '🔊'; });
document.querySelectorAll('#propsBar .prop').forEach(b => b.addEventListener('click', () => useProp(b.dataset.prop)));
$('selfCheckBtn').addEventListener('click', runSelfCheck);
window.addEventListener('resize', () => { if(game && $('gameScreen').classList.contains('active')) layout(); });

renderDiffButtons();

function tick(now){
  if(game && $('gameScreen').classList.contains('active')){
    if(anim && now - anim.start >= anim.dur) anim = null;
    draw(now);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
